<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Unicase:wght@300;400;500;600;700&family=WindSong:wght@500&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tender Template</title>

<style>

/* MAIN TEMPLATE */
.tender-template {
    position: relative !important;
    display: block !important;
    width: 700px !important;
    height: 700px !important;
    margin: 40px auto !important;
    padding: 0 !important;
    overflow: hidden !important;
    box-sizing: border-box !important;
}

/* GRADIENT BORDER */
.tender-template::before {
    content: "";
    position: absolute;
    inset: 0;
    padding: 8px;
    z-index: 20;
    pointer-events: none;
    background: linear-gradient(
        135deg,
        #2B2E4A,
        #E84545,
        #903749,
        #53354A
    );
    -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    box-shadow:
        0 0 10px #ec6666,
        0 0 30px #800000,
        10px 10px 10px rgba(0,0,0,.7);
}
  
/* BACKGROUND IMAGE */
.tender-image {
    position: absolute;
    inset: 0;
    z-index: 1;
    width: 100%;
    height: 100%;
    background-image: url("https://raw.githubusercontent.com/ghettobarbie18/tender/refs/heads/main/demonetta-blood-moon.png");
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    transition: transform .5s ease;
}

/* TITLE AND QUOTE */
.tender-text {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-start;
    padding: 10px 10px 15px;
    box-sizing: border-box;
    color: #fff;
    text-align: left;
    pointer-events: none;
}

/* TITLE */
.tender-title {
    position: relative;
    left: 50px;
    margin: 0;
    font-size: 50px !important;
    font-family: "WindSong", cursive;
    font-weight: 500;
    font-style: normal;
    letter-spacing: 2px !important;
    text-transform: none !important;
    color: #050E3C;
    background: linear-gradient(
        to right,
        #C4A4DA,
        #9E7EB5,
        #7F5D99,
        #4C2365
    );
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

/* QUOTE */
.tender-quote {
    position: relative;
    left: 70px;
    max-width: 580px;
    margin: 0 0 3px;
    font-size: 18px;
    font-family: "Cormorant Unicase", serif;
    font-weight: 400;
    font-style: normal;
    line-height: 1.2;
}

/* HOVER OVERLAY */
.tender-content {
    position: absolute;
    inset: 0;
    z-index: 5;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 15px 15px 30px 20px;
    box-sizing: border-box;
    background: rgba(0,0,0,.7);
    color: #fff;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity .5s ease, visibility .5s ease;
}

/* HOVER TEXTBOX */
.tenderhover-box {
    position: relative;
    z-index: 6;
    width: 500px;
    height: 480px;
    top: 70px;
    padding: 20px;
    box-sizing: border-box;
    overflow-y: auto;
    overflow-x: hidden;
    background: linear-gradient(
        120deg,
        #a30000,
        #630f0f,
        #240306,
        #8b0000,
        #420a0e
    );
    background-size: 300% 300%;
    animation: gradientMove 8s ease infinite;
    border: 1px solid #d10000;
    color: white;
    font-family: "Caudex", serif;
    font-size: 13px;
    line-height: 1.6;
    text-align: justify;
}

/* FLOATING IMAGE */
.tenderhover-float {
    position: absolute;
    top: 6px;
    right: 3px;
    width: 250px;
    height: 180px;
    object-fit: cover;
    z-index: 10;
    pointer-events: auto;
    animation: float 4s ease-in-out infinite;
    transition: filter .4s ease;
}

.tenderhover-float:hover {
    filter:
        drop-shadow(0 0 5px #571357)
        drop-shadow(0 0 10px #571357)
        drop-shadow(0 0 20px #571357);
}

/* FLOAT ANIMATION */
@keyframes float {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-15px);
    }
}

/* MOVING GRADIENT */
@keyframes gradientMove {
    0% {
        background-position: 0% 50%;
    }
    50% {
        background-position: 100% 50%;
    }
    100% {
        background-position: 0% 50%;
    }
}

/* HOVER EFFECTS */
.tender-template:hover .tender-content {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
}

.tender-template:hover .tender-image {
    transform: scale(1.08);
}
</style>
</head>


<body>

<div class="tender-template">

    <div class="tender-image"></div>

    <div class="tender-text">
        <div class="tender-title">Demonetta Skulgarth</div>
        <div class="tender-quote">
            she craves love with fangs. devotion wrapped in chains. and passion that burns like sin.
        </div>
    </div>

    <div class="tender-content">

        <div class="tenderhover-box">
            Your text goes here...
        </div>

        <img
            class="tenderhover-float"
            src="https://i.imgur.com/CbnATeX.png"
            alt=""
        >

    </div>

</div>
</body>
</html>
